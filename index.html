<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS レジアプリ</title>
  <!-- Tailwind CSS CDN (レスポンシブ・UI表示用) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

  <!-- 1. ログイン前画面 -->
  <div id="auth-container" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center border border-gray-100">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold mb-2 text-gray-800">POS レジアプリ</h1>
      <p class="text-sm text-gray-500 mb-6">利用するにはGoogleアカウントでログインしてください。</p>
      <button id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-md transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Googleでログイン
      </button>
    </div>
  </div>

  <!-- 2. ログイン後メイン画面 -->
  <div id="app-container" class="hidden max-w-5xl mx-auto p-4 sm:p-6">
    <!-- ヘッダー (ユーザー情報 & ログアウト) -->
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6 border border-gray-100">
      <div class="flex items-center gap-3">
        <div class="bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">POS</div>
        <div>
          <h1 class="text-lg font-bold text-gray-800">販売記録管理システム</h1>
          <p id="user-info" class="text-xs text-gray-500"></p>
        </div>
      </div>
      <button id="logout-btn" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition">
        ログアウト
      </button>
    </header>

    <!-- メインコンテンツ -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 入力フォーム -->
      <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
        <h2 class="text-lg font-bold mb-4 pb-2 border-b text-gray-800">商品販売の登録</h2>
        
        <form id="pos-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">商品名 <span class="text-red-500">*</span></label>
            <input type="text" id="item-name" required placeholder="例: リンゴ" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">単価 (円) <span class="text-red-500">*</span></label>
              <input type="number" id="item-price" min="0" required placeholder="150" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">個数 <span class="text-red-500">*</span></label>
              <input type="number" id="item-quantity" min="1" value="1" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>
          </div>

          <!-- 自動計算 合計金額表示 -->
          <div class="bg-blue-50 border border-blue-100 p-3 rounded-lg flex justify-between items-center">
            <span class="text-xs font-semibold text-blue-800">合計金額 (自動計算):</span>
            <span id="calc-total" class="text-lg font-bold text-blue-600">¥0</span>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">日付 <span class="text-red-500">*</span></label>
            <input type="date" id="item-date" required class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">メモ</label>
            <textarea id="item-memo" rows="2" placeholder="特記事項（任意）" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"></textarea>
          </div>

          <div id="error-msg" class="text-xs text-red-600 hidden font-semibold bg-red-50 p-2 rounded"></div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition">
            登録する
          </button>
        </form>
      </div>

      <!-- データ一覧 & 集計パネル -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- 集計サマリー (発展機能: 日付・合計金額集計) -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-2 gap-4">
          <div class="border-r border-gray-100 pr-2">
            <p class="text-xs text-gray-500">表示中の合計売上</p>
            <p id="total-sales" class="text-2xl font-bold text-emerald-600">¥0</p>
          </div>
          <div>
            <p class="text-xs text-gray-500">販売件数</p>
            <p id="total-count" class="text-2xl font-bold text-gray-800">0 件</p>
          </div>
        </div>

        <!-- 絞り込みフィルター (発展機能: 商品名・日付での検索) -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-3 items-center">
          <input type="text" id="search-input" placeholder="商品名で検索..." class="w-full sm:w-1/2 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
          <input type="date" id="filter-date" class="w-full sm:w-1/2 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 一覧表示テーブル -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-4 border-b border-gray-100 flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-800">販売記録一覧</h2>
            <span class="text-xs text-gray-400">※個人のデータのみ表示</span>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="bg-gray-50 text-gray-600 border-b border-gray-100">
                  <th class="p-3">日付</th>
                  <th class="p-3">商品名</th>
                  <th class="p-3 text-right">単価</th>
                  <th class="p-3 text-right">個数</th>
                  <th class="p-3 text-right">合計</th>
                  <th class="p-3">メモ</th>
                  <th class="p-3 text-center">操作</th>
                </tr>
              </thead>
              <tbody id="sales-list" class="divide-y divide-gray-100">
                <!-- JSで動的生成 -->
              </tbody>
            </table>
          </div>
          
          <div id="empty-state" class="p-8 text-center text-gray-400 text-sm hidden">
            該当するデータがありません。
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase JavaScript SDK (v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // --------------------------------------------------------------------
    // TODO: ここをご自身の Firebase プロジェクト設定に置き換えてください！
    // --------------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // UI要素の取得
    const authContainer = document.getElementById("auth-container");
    const appContainer = document.getElementById("app-container");
    const loginBtn = document.getElementById("login-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const userInfo = document.getElementById("user-info");
    
    const posForm = document.getElementById("pos-form");
    const itemNameInput = document.getElementById("item-name");
    const itemPriceInput = document.getElementById("item-price");
    const itemQuantityInput = document.getElementById("item-quantity");
    const itemDateInput = document.getElementById("item-date");
    const itemMemoInput = document.getElementById("item-memo");
    const calcTotalText = document.getElementById("calc-total");
    const errorMsg = document.getElementById("error-msg");
    
    const salesList = document.getElementById("sales-list");
    const emptyState = document.getElementById("empty-state");
    const totalSalesText = document.getElementById("total-sales");
    const totalCountText = document.getElementById("total-count");
    const searchInput = document.getElementById("search-input");
    const filterDateInput = document.getElementById("filter-date");

    let currentUser = null;
    let allSalesData = [];

    // 初期設定：本日の日付
    itemDateInput.value = new Date().toISOString().split('T')[0];

    // 自動計算 (単価 × 個数)
    function updateCalcTotal() {
      const price = Number(itemPriceInput.value) || 0;
      const quantity = Number(itemQuantityInput.value) || 0;
      const total = price * quantity;
      calcTotalText.textContent = `¥${total.toLocaleString()}`;
    }
    itemPriceInput.addEventListener("input", updateCalcTotal);
    itemQuantityInput.addEventListener("input", updateCalcTotal);

    // Google ログイン
    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("ログインに失敗しました: " + err.message);
      }
    });

    // ログアウト
    logoutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    // 認証状態の監視 (ログインしているユーザーごとに画面切り替え)
    let unsubscribeSnapshot = null;
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authContainer.classList.add("hidden");
        appContainer.classList.remove("hidden");
        userInfo.textContent = `ログイン中: ${user.displayName || user.email}`;
        listenToSalesData(user.uid);
      } else {
        currentUser = null;
        authContainer.classList.remove("hidden");
        appContainer.classList.add("hidden");
        if (unsubscribeSnapshot) unsubscribeSnapshot();
      }
    });

    // 登録機能
    posForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");

      const name = itemNameInput.value.trim();
      const price = Number(itemPriceInput.value);
      const quantity = Number(itemQuantityInput.value);
      const date = itemDateInput.value;
      const memo = itemMemoInput.value.trim();

      // エラーチェック (バリデーション)
      if (!name || isNaN(price) || isNaN(quantity) || !date) {
        showError("すべての必須項目を入力してください。");
        return;
      }
      if (price < 0 || quantity < 1) {
        showError("単価は0以上、個数は1以上を入力してください。");
        return;
      }

      const total = price * quantity;

      try {
        await addDoc(collection(db, "sales"), {
          userId: currentUser.uid,
          name,
          price,
          quantity,
          total,
          date,
          memo,
          createdAt: new Date()
        });

        // フォームリセット
        itemNameInput.value = "";
        itemPriceInput.value = "";
        itemQuantityInput.value = "1";
        itemMemoInput.value = "";
        updateCalcTotal();
      } catch (err) {
        showError("保存に失敗しました: " + err.message);
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
    }

    // リアルタイム読み込み (ログインユーザーのデータのみ抽出)
    function listenToSalesData(userId) {
      const q = query(
        collection(db, "sales"),
        where("userId", "==", userId)
      );

      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        allSalesData = [];
        snapshot.forEach((docSnap) => {
          allSalesData.push({ id: docSnap.id, ...docSnap.data() });
        });

        // JS側で日付降順ソート
        allSalesData.sort((a, b) => (b.date > a.date ? 1 : -1));

        renderSalesList();
      }, (err) => {
        console.error("Firestore error:", err);
      });
    }

    // 削除機能 (グローバル関数化)
    window.deleteSale = async (id) => {
      if (confirm("この項目を削除しますか？")) {
        try {
          await deleteDoc(doc(db, "sales", id));
        } catch (err) {
          alert("削除に失敗しました: " + err.message);
        }
      }
    };

    // 一覧の描画・フィルタリング・集計
    function renderSalesList() {
      const keyword = searchInput.value.trim().toLowerCase();
      const filterDate = filterDateInput.value;

      const filtered = allSalesData.filter((item) => {
        const matchesKeyword = item.name.toLowerCase().includes(keyword);
        const matchesDate = filterDate ? item.date === filterDate : true;
        return matchesKeyword && matchesDate;
      });

      salesList.innerHTML = "";
      let grandTotal = 0;

      if (filtered.length === 0) {
        emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
        filtered.forEach((item) => {
          grandTotal += item.total || 0;

          const tr = document.createElement("tr");
          tr.className = "hover:bg-gray-50 border-b border-gray-100";
          tr.innerHTML = `
            <td class="p-3 text-gray-600 whitespace-nowrap">${item.date}</td>
            <td class="p-3 font-semibold text-gray-800">${escapeHtml(item.name)}</td>
            <td class="p-3 text-right">¥${item.price.toLocaleString()}</td>
            <td class="p-3 text-right">${item.quantity}</td>
            <td class="p-3 text-right font-bold text-blue-600">¥${item.total.toLocaleString()}</td>
            <td class="p-3 text-gray-500 max-w-xs truncate" title="${escapeHtml(item.memo || '')}">${escapeHtml(item.memo || '-')}</td>
            <td class="p-3 text-center whitespace-nowrap">
              <button onclick="deleteSale('${item.id}')" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 py-1 px-2.5 rounded font-medium transition">
                削除
              </button>
            </td>
          `;
          salesList.appendChild(tr);
        });
      }

      totalSalesText.textContent = `¥${grandTotal.toLocaleString()}`;
      totalCountText.textContent = `${filtered.length} 件`;
    }

    searchInput.addEventListener("input", renderSalesList);
    filterDateInput.addEventListener("change", renderSalesList);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }
  </script>
</body>
</html>
